[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realta"
version = "0.1.0"
description = "A Monte Carlo model for High Mass X-ray Binaries in globular clusters."
readme = "README.md"
authors = [{ name = "Chris Power" }]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pyyaml>=5.4.0",
]

[project.scripts]
realta = "realta.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/realta"]

#[tool.hatch.build.targets.wheel.force-include]
#"src/realta/data" = "realta/data"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
